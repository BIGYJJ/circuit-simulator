name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUILD_PURPOSE: release
  RELEASE_SOURCE_COMMIT: ${{ github.sha }}
  APP_BUILD_ID: git-${{ github.sha }}
  FLUXLAB_PLAYWRIGHT_TARGET: local-rc

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Allocate release run id
        run: |
          id="$(openssl rand -hex 16)"
          echo "RELEASE_RUN_ID=$id" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_ROOT=$GITHUB_WORKSPACE/tests/.artifacts/release/runs/$id" >> "$GITHUB_ENV"
      - name: Refuse a reused run root
        run: |
          if [ -e "$RELEASE_RUN_ROOT" ]; then
            echo "release run root already exists" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:release
      - run: node scripts/verify-dependencies.mjs package.json
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2, gitleaks v8.30.1 baseline
      - name: Pre-manifest release gates
        run: |
          node scripts/run-release-gates.mjs --phase pre-manifest --release-run-id "$RELEASE_RUN_ID" --run-root "$RELEASE_RUN_ROOT" --source-commit "$RELEASE_SOURCE_COMMIT" --app-build-id "$APP_BUILD_ID"
      - name: Create release manifest
        run: |
          node scripts/create-release-manifest.mjs --release-run-id "$RELEASE_RUN_ID" --dist dist/public --evidence "$RELEASE_RUN_ROOT/evidence/pre-manifest" --source-archive "$RELEASE_RUN_ROOT/fluxlab-source-$RELEASE_SOURCE_COMMIT.tar" --output dist/public/release-manifest.json
      - name: Post-manifest release gates
        run: |
          node scripts/run-release-gates.mjs --phase post-manifest --release-run-id "$RELEASE_RUN_ID" --run-root "$RELEASE_RUN_ROOT" --source-commit "$RELEASE_SOURCE_COMMIT" --app-build-id "$APP_BUILD_ID" --expected-manifest dist/public/release-manifest.json
